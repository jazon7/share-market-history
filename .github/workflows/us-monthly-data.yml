# Refresh the US monthly data (Shiller: prices, dividends, CPI, bond yields,
# CAPE) once a month, so the Valuation tab shows the latest CAPE. Commits only
# when the data changed; Posit Connect Cloud republishes on the push.
#
# The yearly update (code/update.R, which needs the manual S&P export for
# Australia) still rebuilds everything else.
#
# code/us_monthly.R checks the download before writing (plausible values,
# and no change to history more than two years back), so a broken or
# altered file fails this job instead of reaching the app.
#
# Supply chain: actions are pinned to commit SHAs (the tag is in the
# comment), and R packages come from a dated Posit Package Manager
# snapshot, so a run installs the same code every month. To update, bump
# the SHAs and the snapshot date together and run the workflow by hand.
name: Monthly US data refresh

on:
  schedule:
    - cron: "0 6 5 * *"      # 06:00 UTC on the 5th of each month
  workflow_dispatch:          # or run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04       # fixed, to match the package snapshot below
    timeout-minutes: 20
    env:
      # prebuilt binaries for Ubuntu 24.04 (noble), frozen at this date
      RSPM_SNAPSHOT: https://packagemanager.posit.co/cran/__linux__/noble/2026-11-02
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: "4.6.1"      # the R version in manifest.json

      - name: Install R packages
        run: Rscript -e 'install.packages(c("dplyr", "readxl", "tidyr"), repos = Sys.getenv("RSPM_SNAPSHOT"))'

      - name: Rebuild data/usmonthly.RDS from Shiller's data
        run: |
          cp data/usmonthly.RDS "$RUNNER_TEMP/previous.RDS"
          Rscript code/us_monthly.R
          # compare the data, not the bytes: the file records the R version
          # that wrote it, so a different R alone would look like a change
          Rscript -e 'if(identical(readRDS(file.path(Sys.getenv("RUNNER_TEMP"), "previous.RDS")), readRDS("data/usmonthly.RDS"))) quit(status = 3)' \
            && echo "Data changed." \
            || { [ $? -eq 3 ] && cp "$RUNNER_TEMP/previous.RDS" data/usmonthly.RDS && echo "Same data; file left as it was."; }

      - name: Commit and push if the data changed
        run: |
          if git diff --quiet -- data/usmonthly.RDS; then
            echo "No change in the US monthly data."
            exit 0
          fi
          # keep manifest.json's checksum for the file in step
          sum=$(md5sum data/usmonthly.RDS | cut -d' ' -f1)
          jq --arg s "$sum" '.files["data/usmonthly.RDS"].checksum = $s' manifest.json > manifest.tmp
          mv manifest.tmp manifest.json
          latest=$(Rscript -e 'm <- readRDS("data/usmonthly.RDS"); m <- m[!is.na(m$cape), ]; m <- m[nrow(m), ]; cat(sprintf("%s %d, CAPE %.1f", month.name[m$month], m$year, m$cape))')
          git config user.name "jazon7"
          git config user.email "67318977+jazon7@users.noreply.github.com"
          git add data/usmonthly.RDS manifest.json
          git commit -m "Monthly US data refresh: latest $latest"
          git push
